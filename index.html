<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation Bernadette & Mathieu</title>
    <style>
        /* --- Styles Généraux --- */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Arrière-plan bleu dégradé élégant */
            background: linear-gradient(135deg, #0ea5e9, #0284c7, #0369a1, #075985);
            font-family: 'Playfair Display', 'Georgia', serif;
            overflow: hidden;
            user-select: none;
        }

        /* --- Textes --- */
        .text-top {
            color: #f59e0b; /* Or brillant */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 10;
            font-size: 2.2rem;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: opacity 0.3s ease; /* Disparition rapide */
        }

        .text-bottom {
            color: #ffffff; /* Modification : Couleur Blanche */
            text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
            text-align: center;
            z-index: 10;
            font-size: 1.4rem;
            margin-top: 40px;
            cursor: pointer;
            transition: opacity 0.3s ease; /* Disparition rapide */
            animation: pulse 1.5s infinite alternate;
        }

        /* --- Animations --- */
        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-15px); }
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; transform: scale(1.02); }
        }

        /* --- Conteneur Principal de l'Enveloppe --- */
        .envelope-wrapper {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #f8fafc; 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            animation: float 2.5s ease-in-out infinite alternate;
            transition: transform 0.5s ease, opacity 0.8s ease;
            overflow: hidden; /* Masque complètement la carte au début */
        }

        /* Bordures dorées sur l'enveloppe */
        .envelope-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 3px solid #d4af37; /* Or métallique */
            pointer-events: none;
            z-index: 6;
        }

        /* --- Rabat Supérieur (Le Triangle) --- */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 110px solid #d4af37; /* Couleur dorée */
            transform-origin: top;
            transition: transform 0.4s ease-in-out, z-index 0.2s;
            z-index: 5;
        }

        /* Doublure intérieure du rabat */
        .flap::after {
            content: '';
            position: absolute;
            top: -110px;
            left: -146px;
            width: 0;
            height: 0;
            border-left: 146px solid transparent;
            border-right: 146px solid transparent;
            border-top: 106px solid #f1f5f9;
        }

        /* --- Côtés de l'enveloppe --- */
        .pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid #ffffff;
            border-right: 150px solid #f1f5f9;
            border-bottom: 100px solid #e2e8f0;
            z-index: 4;
        }

        /* --- La Carte d'Invitation (Masquée au départ) --- */
        .letter {
            position: absolute;
            bottom: -180px; 
            left: 15px;
            width: 270px;
            height: 180px;
            background: linear-gradient(135deg, #ffffff, #f8fafc);
            border: 2px solid #d4af37; /* Bordure Or */
            border-radius: 4px;
            z-index: 1;
            opacity: 0;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .letter h1 {
            font-size: 2.2rem;
            color: #b59410;
            margin: 0 0 5px 0;
        }

        .letter p {
            font-size: 1rem;
            color: #334155;
            margin: 5px 0 0 0;
            line-height: 1.4;
        }

        /* --- États lors de l'Ouverture (JS) --- */
        .envelope-wrapper.open {
            overflow: visible; 
        }

        .envelope-wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 2; 
        }

        .envelope-wrapper.open .letter {
            opacity: 1; 
            transform: translateY(-260px); 
            z-index: 7; 
        }

        /* Disparition finale avant redirection */
        .fade-out {
            opacity: 0;
            transform: scale(0.9) !important;
        }
    </style>
</head>
<body>

    <!-- Élément Audio -->
    <audio id="inviteMusic" src="https://soundhelix.com" preload="auto"></audio>

    <!-- Texte Supérieur -->
    <div class="text-top" id="textTop">Une invitation vous attend</div>

    <!-- Enveloppe -->
    <div class="envelope-wrapper" id="envelope">
        <div class="flap"></div>
        <div class="pocket"></div>
        
        <!-- Invitation interne -->
        <div class="letter">
            <h1>B & M</h1>
            <p>Découvrez l'invitation de<br><strong>Bernadette et Mathieu</strong></p>
        </div>
    </div>

    <!-- Texte Inférieur -->
    <div class="text-bottom" id="textBottom">Cliquer pour ouvrir</div>

    <script>
        const envelope = document.getElementById('envelope');
        const music = document.getElementById('inviteMusic');
        const textTop = document.getElementById('textTop');
        const textBottom = document.getElementById('textBottom');
        
        const targetUrl = "Invit.html";

        envelope.addEventListener('click', () => {
            // Lecture de la musique
            music.play().catch(error => console.log("Audio bloqué par le navigateur"));

            // Déclenchement de l'ouverture de l'enveloppe
            envelope.classList.add('open');
            
            // Les deux textes disparaissent immédiatement et ensemble au clic
            textTop.style.opacity = '0';
            textBottom.style.opacity = '0';

            // Redirection après affichage de l'invitation
            setTimeout(() => {
                envelope.classList.add('fade-out');
                document.body.style.transition = "background 0.8s ease";
                document.body.style.background = "#0369a1"; 

                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 800);

            }, 2800); 
        });
    </script>
</body>
</html>
